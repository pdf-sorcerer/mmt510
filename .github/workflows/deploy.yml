name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Strava activity
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/fetch_strava.py

      - name: Save rotated Strava refresh token
        if: ${{ hashFiles('.strava_refresh_token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.STRAVA_GITHUB_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat .strava_refresh_token)"
          rm -f .strava_refresh_token

      - name: Build Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
